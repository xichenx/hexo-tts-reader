    * { box-sizing: border-box; }
    body { margin:0; background:#fafafa; color:#272934; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    main { max-width:940px; margin:auto; padding:66px 28px 110px; }
    .brand { display:flex; align-items:center; gap:10px; margin:0 0 18px; font-size:11px; font-weight:600; letter-spacing:.14em; color:#8a8d9b; }
    h1 { font-size:32px; line-height:1.3; letter-spacing:-.04em; font-weight:650; margin:0 0 12px; }
    .intro { margin:0 0 36px; font-size:13px; line-height:1.8; color:#8a8d97; }
    .previews { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .stage { position:relative; display:flex; align-items:center; justify-content:center; min-height:320px; padding:50px 18px 28px; border-radius:24px; background:#f0f1f5; }
    .stage.dark { background:#1b1c24; }
    .stage-label { position:absolute; top:22px; left:24px; font-size:11px; color:#9093a1; }
    .stage .hexo-reader { position:relative; inset:auto; display:grid; width:min(328px, calc(100vw - 32px)); height:auto; z-index:1; }
    .stage .hexo-reader__panel { position:relative; inset:auto; grid-area:1 / 1; margin:0 auto; }
    .stage .hexo-reader__launcher { grid-area:1 / 1; align-self:center; justify-self:center; }
    .notes { display:flex; justify-content:space-between; gap:20px; margin-top:22px; color:#9497a2; font-size:11px; line-height:1.8; }
    .notes p { margin:0; }
    @media (max-width:760px) { main { padding:36px 16px 100px; } .previews { grid-template-columns:1fr; } .stage { min-height:300px; padding-inline:0; } .notes { flex-direction:column; gap:6px; } h1 { font-size:27px; } }
