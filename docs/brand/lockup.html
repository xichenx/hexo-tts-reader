<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hexo-tts-reader · Brand lockup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: #252a42; font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .lockup { width: 1200px; height: 340px; display: flex; align-items: center; justify-content: center; gap: 36px; }
    .symbol { width: 226px; height: 226px; flex: none; }
    h1 { font-size: 73px; line-height: 1.2; font-weight: 600; letter-spacing: -3.6px; margin: 0 0 15px; white-space: nowrap; }
    h1 strong { font-weight: 600; letter-spacing: -2px; color: #626de9; }
    .tagline { margin: 0 0 7px 3px; font-size: 27px; letter-spacing: .2px; color: #737b96; }
    .descriptor { margin: 0 0 0 4px; color: #939bb1; font-size: 11px; font-weight: 600; letter-spacing: 3.4px; }
    body.dark { color: #edf0ff; }
    .dark h1 strong { color: #9ba5ff; }
    .dark .tagline { color: #b0bad4; }
    .dark .descriptor { color: #8591b0; }
  </style>
</head>
<body>
  <main class="lockup">
    <img class="symbol" src="../../assets/brand/icon.svg" alt="Article lines flowing into a sound wave">
    <div><h1>hexo <strong>tts</strong> reader</h1><p class="tagline">Your blog, out loud.</p><p class="descriptor">TEXT TO SPEECH FOR HEXO</p></div>
  </main>
</body>
</html>
