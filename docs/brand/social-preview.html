<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hexo-tts-reader · Social preview</title>
  <link rel="icon" type="image/png" href="../../assets/brand/icon-64.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #edf1ff; background: #101627; font-family: 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { width: 1280px; height: 640px; padding: 62px 80px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 12% 48%, #23325580, transparent 49%); }
    .eyebrow { color: #9ba8ca; font-size: 13px; font-weight: 600; letter-spacing: 3.2px; }
    .identity { display: flex; align-items: center; gap: 42px; margin-top: 54px; }
    .identity img { width: 240px; height: 240px; }
    h1 { margin: 0 0 18px; font-size: 73px; font-weight: 600; letter-spacing: -3.6px; line-height: 1.2; }
    h1 strong { font-weight: 600; letter-spacing: -2px; color: #9ba5ff; }
    .tagline { margin: 0; color: #b5c1df; font-size: 30px; }
    footer { position: absolute; bottom: 58px; left: 80px; right: 80px; border-top: 1px solid #2b354d; padding-top: 25px; display: flex; justify-content: space-between; color: #7f8aa8; font-size: 14px; }
    footer span:first-child { color: #a2afce; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">TEXT TO SPEECH FOR HEXO</div>
    <div class="identity">
      <img src="../../assets/brand/icon.svg" alt="Article lines flowing into a sound wave">
      <div><h1>hexo <strong>tts</strong> reader</h1><p class="tagline">Your blog, out loud.</p></div>
    </div>
    <footer><span>Natural voices. Static audio. Made for reading.</span><span>github.com/xichenx/hexo-tts-reader</span></footer>
  </main>
</body>
</html>
