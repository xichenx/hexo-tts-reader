<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hexo-tts-reader · Social preview</title>
  <link rel="icon" type="image/png" href="../../assets/brand/icon-64.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #302923; background: #fff8f2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { width: 1280px; height: 640px; padding: 68px 84px; position: relative; overflow: hidden; }
    .eyebrow { font-size: 14px; letter-spacing: 3px; font-weight: 600; color: #b97d62; }
    .identity { display: flex; gap: 52px; align-items: center; margin-top: 66px; }
    .identity img { width: 244px; height: 244px; object-fit: contain; }
    h1 { font-size: 62px; font-weight: 700; letter-spacing: -2.6px; margin: 0 0 20px; line-height: 1.15; }
    .tagline { font-size: 27px; font-weight: 400; color: #968276; margin: 0; }
    footer { position: absolute; bottom: 62px; left: 84px; right: 84px; padding-top: 26px; border-top: 1px solid #efdfd3; display: flex; justify-content: space-between; color: #a28a7b; font-size: 15px; }
    .features { color: #b37252; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">BLOG TEXT → SPEECH · HEXO PLUGIN</div>
    <div class="identity">
      <img src="../../assets/brand/icon.png" alt="Blog article converted to speech">
      <div><h1>hexo-tts-reader</h1><p class="tagline">Turn your blog posts into speech.</p></div>
    </div>
    <footer><span class="features">Article narration &nbsp; / &nbsp; Edge TTS &nbsp; / &nbsp; No API key</span><span>github.com/xichenx/hexo-tts-reader</span></footer>
  </main>
</body>
</html>
